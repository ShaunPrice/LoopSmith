; LoopSmith v2 — Teensy 4.1 + Audio Shield (Rev D)
; Build:   pio run                (default env: USB serial + MIDI + audio)
; Upload:  pio run -t upload      (or the Teensy loader with .pio/build/<env>/firmware.hex)

[platformio]
default_envs = teensy41

[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
; command-line upload (teensy_loader_cli); no Teensy Loader GUI needed
upload_protocol = teensy-cli

; Default: the pedal is a USB serial console/editor link, a class-compliant MIDI
; device (program change = preset, CCs = looper), AND a USB sound card — a
; companion computer can record the pedal's output and play backing tracks into it.
[env:teensy41]
build_flags =
    -D USB_MIDI_AUDIO_SERIAL
    -Wall

; Plain USB serial only (smallest build; no MIDI, no USB audio)
[env:teensy41_serial]
build_flags =
    -D USB_SERIAL
    -Wall
