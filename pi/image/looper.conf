# LoopSmith companion — configuration read at every boot.
# Lives on the SD card's boot partition (bootfs, readable on any computer) so you
# can change it without logging in. Keep KEY=VALUE, one per line, no quotes needed.

# --- onboarding Wi-Fi ---
# Until the pedal has joined a network, it puts up its own Wi-Fi so you can set it up from a
# phone. The name is fixed; the password is generated on first boot and shown on the screen
# (and written to setup-code.txt on this partition). Once it has joined your network the
# hotspot is switched off and stays off.
HOTSPOT_SSID=LoopSmith-setup

# --- your home Wi-Fi (optional here; you can also join it from http://10.42.0.1/setup) ---
HOME_SSID=
HOME_PASS=

# The Pi 5 has one radio: it runs the setup hotspot until a network is joined, then joins it.

# --- updates ---
# The Pi installs update bundles it finds on the USB drive or this boot partition
# (looper-update-*.tar.gz, built by pi/image/build_release.sh) — no network needed.
# Optionally it can fetch them itself:
#   UPDATE_URL=https://example.com/looper-update.tar.gz     any HTTPS tarball
#   UPDATE_REPO=owner/name  (+ UPDATE_BRANCH, default master) a GitHub repository;
#     a private one needs a token you create yourself in /etc/looper/github-token (chmod 600)
UPDATE_URL=
UPDATE_REPO=
UPDATE_BRANCH=master
# check and install automatically once a day (the Studio button works either way)
UPDATE_AUTO=1

# --- access ---
# Browsers that are not the pedal's own screen must sign in with the login below
# (the HDMI kiosk never asks). Set to 0 to let anyone on the network straight in.
WEB_AUTH=1

# --- system ---
HOSTNAME=loopsmith
COUNTRY=AU
TIMEZONE=Australia/Sydney
# show a splash screen at boot instead of scrolling kernel text (needs the plymouth packages,
# fetched with the kiosk browser on first internet contact)
SPLASH=1
# show the Studio full-screen on the HDMI display (Chromium is installed on first
# internet contact; until then the screen shows the console)
KIOSK=1
